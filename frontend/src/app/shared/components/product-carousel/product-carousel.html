<section class="product-carousel-section">
  <div class="container">
    <h2 class="section-title">{{ title }}</h2>
    <div class="carousel-container">
      <div class="carousel-row">
        <button class="carousel-arrow prev" (click)="prev()" aria-label="Previous">&lsaquo;</button>

        <div class="carousel-track-wrapper">
          <div
            class="carousel-track"
            [style.transform]="'translateX(calc(-1 * ' + index() + ' * (100% + 16px) / ' + itemsPerPage() + '))'">
            @for (product of products; track product.id) {
              <div class="carousel-item">
                <app-product-card [product]="product" />
              </div>
            }
          </div>
        </div>

        <button class="carousel-arrow next" (click)="next()" aria-label="Next">&rsaquo;</button>
      </div>

      @if (viewAllLink) {
        <div class="view-all-wrapper">
          <a [routerLink]="viewAllLink" class="view-all-btn">See all</a>
        </div>
      }
    </div>
  </div>
</section>
