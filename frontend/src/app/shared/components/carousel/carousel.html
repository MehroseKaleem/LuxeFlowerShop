<section class="carousel-section" [class]="'tint-' + tint" [attr.aria-label]="ariaLabel">
  <div class="carousel-heading">
    @if (title) {
      <h2 class="section-title" appReveal="up">{{ title }}</h2>
    }
  </div>

  <div class="carousel-viewport" appReveal="fade" [revealDelay]="100">
    @if (canSlide()) {
      <button type="button" class="carousel-arrow prev" (click)="prev()" [disabled]="!canPrev()" aria-label="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    }

    <div class="carousel-track-wrapper">
      <div
        class="carousel-track"
        [class.static-row]="!canSlide()"
        [style.transform]="trackTransform()">
        @for (item of items; track trackByIndex($index); let i = $index) {
          <div class="carousel-slide">
            <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
          </div>
        }
      </div>
    </div>

    @if (canSlide()) {
      <button type="button" class="carousel-arrow next" (click)="next()" [disabled]="!canNext()" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    }
  </div>

  @if (viewAllLink) {
    <div class="view-all-wrapper">
      <a [routerLink]="viewAllLink" class="view-all-btn">Discover the Collection</a>
    </div>
  }
</section>
