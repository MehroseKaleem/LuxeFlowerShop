<section class="hero-carousel" id="hero-carousel">
  <div class="carousel-track">
    @for (slide of slides(); track slide.image; let i = $index) {
      <div
        class="carousel-slide"
        [class.active]="currentSlide() === i"
        [class.prev]="currentSlide() !== i">
        @if (slide.link) {
          <a [href]="slide.link">
            <img [src]="slide.image" [alt]="slide.alt" class="slide-image" />
          </a>
        } @else {
          <img [src]="slide.image" [alt]="slide.alt" class="slide-image" />
        }
      </div>
    }
  </div>

  <!-- Carousel Controls -->
  <div class="carousel-controls" id="carousel-controls">
    <button class="carousel-btn prev-btn" (click)="prevSlide()" aria-label="Previous slide">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <span class="carousel-counter">{{ currentSlide() + 1 }}/{{ slides().length }}</span>

    <button class="carousel-btn next-btn" (click)="nextSlide()" aria-label="Next slide">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <button class="carousel-btn pause-btn" (click)="toggleAutoPlay()" [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'">
      @if (isPlaying()) {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      } @else {
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
      }
    </button>
  </div>
</section>
