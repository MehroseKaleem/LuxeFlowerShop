<div class="ambient-layer" aria-hidden="true">
  <div class="orb-slot slot-a" [style.transform]="offset(0.08)">
    <span class="orb-shape shape-pink drift-1"></span>
  </div>
  <div class="orb-slot slot-b" [style.transform]="offset(-0.12)">
    <span class="orb-shape shape-dark drift-2"></span>
  </div>
  <div class="orb-slot slot-c" [style.transform]="offset(0.06)">
    <span class="orb-shape shape-pink drift-3"></span>
  </div>
  <div class="orb-slot slot-d" [style.transform]="offset(-0.05)">
    <span class="orb-shape shape-blush drift-1"></span>
  </div>
  <div class="orb-slot slot-e" [style.transform]="offset(0.1)">
    <span class="orb-shape shape-dark drift-2"></span>
  </div>
  <div class="orb-slot slot-f" [style.transform]="offset(-0.08)">
    <span class="orb-shape shape-pink drift-3"></span>
  </div>

  <div class="sparkle-field">
    @for (s of sparkles; track $index) {
      <span
        class="sparkle"
        [class.sparkle--pink]="s.color === 'pink'"
        [style.left.%]="s.left"
        [style.top.%]="s.top"
        [style.width.px]="s.size"
        [style.height.px]="s.size"
        [style.animation-delay.s]="s.delay"
        [style.animation-duration.s]="s.duration"></span>
    }
  </div>
</div>
