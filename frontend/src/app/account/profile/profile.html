<div class="profile-page">
  <section class="panel">
    <h2>Profile Details</h2>
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <div class="form-field">
        <label>Name</label>
        <input type="text" formControlName="name" />
      </div>
      <div class="form-field">
        <label>Phone</label>
        <input type="tel" formControlName="phone" />
      </div>
      <div class="form-field">
        <label>Email</label>
        <input type="email" [value]="auth.user()?.email" disabled />
      </div>
      <button type="submit" class="save-btn" [disabled]="savingProfile()">
        {{ savingProfile() ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>
  </section>

  <section class="panel">
    <h2>Change Password</h2>
    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <div class="form-field">
        <label>Current password</label>
        <input type="password" formControlName="currentPassword" />
      </div>
      <div class="form-field">
        <label>New password</label>
        <input type="password" formControlName="newPassword" />
        @if (passwordForm.controls.newPassword.invalid && passwordForm.controls.newPassword.touched) {
          <span class="field-error">Minimum 8 characters, including at least one number.</span>
        }
      </div>
      <button type="submit" class="save-btn" [disabled]="savingPassword()">
        {{ savingPassword() ? 'Updating...' : 'Update Password' }}
      </button>
    </form>
  </section>
</div>
