<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-title">Set New Password</h1>

    @if (success()) {
      <div class="auth-success">Your password has been reset. Redirecting to login...</div>
    } @else {
      @if (errorMessage()) {
        <div class="auth-error">{{ errorMessage() }}</div>
      }

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-field">
          <label for="password">New password</label>
          <input id="password" type="password" formControlName="password" autocomplete="new-password" />
          @if (form.controls.password.invalid && form.controls.password.touched) {
            <span class="field-error">Minimum 8 characters, including at least one number.</span>
          }
        </div>

        <button type="submit" class="auth-submit" [disabled]="submitting()">
          {{ submitting() ? 'Saving...' : 'Reset Password' }}
        </button>
      </form>
    }

    <div class="auth-links">
      <a routerLink="/account/login">&larr; Back to login</a>
    </div>
  </div>
</div>
